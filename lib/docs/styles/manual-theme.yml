extends: default

font:
  catalog:
    merge: true
    Noto Sans Mono:
      normal: NotoSansMono-Regular.ttf
      bold: NotoSansMono-Bold.ttf
      italic: NotoSansMono-Regular.ttf
      bold_italic: NotoSansMono-Bold.ttf

title-page:
  background-image: image:../images/cover.png[fit=cover]

  logo:
    image: image:../images/title.png[pdfwidth=82%,align=center]
    top: 25vh

  title:
    display: none

  authors:
    display: none

  revision:
    display: none

toc:
  font-size: 12
  line-height: 1.2
  indent: 18
  hanging-indent: 2
  h2:
    font-color: 4A2F1C
    font-style: bold
    font-size: 11.5
    line-height: 1.25
  h3:
    font-color: 6C6257
    font-style: normal
    font-size: 10
    line-height: 1.1
  dot-leader:
    levels: all
    font-color: A78B62

toc-title:
  font-size: 20
  font-color: 4A2F1C

code:
  font-family: Noto Sans Mono
  font-size: 9.25
  line-height: 1.15

verse:
  font-color: 5A3B22
  font-style: italic
  font-size: 14
  line-height: 1.35

role:
  intro-quote:
    font-color: 5A3B22
    font-style: italic
    font-size: 15
  section-quote:
    font-color: 5A3B22
    font-style: italic
    font-size: 13
    line-height: 1.3
  manual-toc:
    font-size: 10
  welcome-note:
    font-color: 6C6257
    font-size: 8.25
  welcome-note-text:
    font-color: 6C6257
    font-size: 8.25
    line-height: 1.15
  welcome-bottom-spacer:
    font-color: FFFFFF
    font-size: 36
    line-height: 1
